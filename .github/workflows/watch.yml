name: watch
# The suite watchdog. Reads COP's public snapshot and health.json and fails when COP's own build is more than 6 hours
# old, when a program is not fresh, when a program's data time runs into the future, or when the build left a
# malformed item out of the picture, or when the hub's site check (tic-sitecheck) failed a page or has not run in
# 14 hours (tools/suite_watch.py). A failed run is
# the alert: GitHub mails the repository owner. It runs apart from build.yml because a build that has stopped
# cannot report itself.
#
# The clock: GitHub fires schedules late (every 7 to 14 hours, measured 5-6 Nov 2026), so this is a slow check
# until the hub's tic-dispatch Worker also starts it (workflow_dispatch is here for that).
#
# Optional: repo secret HC_PING_URL, a Healthchecks.io check address. With it, each run pings the check (and its
# /fail address on a problem), so Healthchecks.io can say when this watchdog itself has stopped. Without it nothing
# is sent anywhere. Tom sets the secret; the address is never written in a file.
#
# Two in a row (23 Nov 2026): a problem fails the run only when the run before saw it too, so one bad read between
# two good ones no longer sends an alert. The list of problems seen is kept in the Actions cache between runs
# (watch-state-*); a missing cache means no earlier sighting, so at worst an alert comes one run late.
#
# To test the alerts: Actions > watch > Run workflow, tick test_failure (or
# gh workflow run watch.yml -f test_failure=true). The run fails with a line that says it is a test.
# tic-dispatch sends no inputs, so its runs never test.
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      test_failure:
        description: "Fail on purpose, to test that the alert mails arrive"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: watch
  cancel-in-progress: true
jobs:
  # Data quality (ideas#245, from the database review of 24 Nov 2026): seven rules on the bus, report only. It never
  # fails the run and never touches an item; hits are warnings in the run's summary (tools/data_quality.py says each
  # rule and its finding). Item counts per program and source are kept between runs in the Actions cache
  # (dq-state-*) for the rows-low rule; a missing cache only means no norm yet.
  data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Earlier runs' item counts
        uses: actions/cache/restore@v6
        with:
          path: dq-state.json
          key: dq-state-${{ github.run_id }}
          restore-keys: dq-state-
      - name: Data quality (report only)
        run: python tools/data_quality.py --state dq-state.json || true
      - name: Keep this run's item counts
        if: always() && hashFiles('dq-state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: dq-state.json
          key: dq-state-${{ github.run_id }}
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: What the last run saw
        uses: actions/cache/restore@v6
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Is every program current?
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          TEST_FAILURE: ${{ inputs.test_failure && '--test-failure' || '' }}
        run: python tools/suite_watch.py --state watch-state.json $TEST_FAILURE
      - name: Remember what this run saw
        if: always() && hashFiles('watch-state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
