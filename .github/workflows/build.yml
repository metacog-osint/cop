name: build
# Rebuilds COP every two hours and on every push to main: the tests, a fresh snapshot of the program feeds, a daily
# archive copy (release snapshots-YYYY-MM, last snapshot of each UTC day, plus the first build of each 6-hour slot),
# outage triage (COP's own reading of each
# Blackout outage, with base rates from the archived days), the three-signal join (the Strait of Hormuz and the
# Gulf), then a deploy of site/ to Cloudflare Pages
# (project cop). Needs repo secrets CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID; without
# them everything runs except the deploy. A program feed that fails never fails the build (snapshot.py keeps its last
# good copy, drawn grey). The deploy also carries functions/mcp.js, COP's MCP server at /mcp, which reads the
# small files tools/agent_index.py writes to site/data/agent/ (wrangler.toml; packages pinned in package-lock.json).
# After the deploy, three archive steps that fail loudly but never hold the site back: the 6-hourly snapshots, the suite
# ledger (release ledger, then ledger-YYYY from 2027: what is new, changed or ended since the last build) and the
# dropped-items log (what sift() left out as malformed, with reasons).
#
# The clock: GitHub fired the "every two hours" schedule only every 7 to 14 hours (5-6 Nov 2026), so the hub's
# tic-dispatch Worker starts this workflow at :20 past every even UTC hour (workflow_dispatch). The schedule stays as a
# fallback, and the gate job skips a scheduled run when a build succeeded in the last 45 minutes, so the two clocks
# don't double the private repo's Actions minutes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at // empty' || true)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 2700 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "A build finished at $last, under 45 minutes ago: skipping this run."
          else
            echo "Last successful build: ${last:-none found}. Running."
          fi
  build:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Packages for the MCP server (exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests (the list is in tests/run_all.py, shared with tests.yml)
        run: python tests/run_all.py
      - name: Kit copy is intact
        run: python doctrine/kit/tic.py kitcheck
      # The snapshot also fetches each program's list of recently ended items (config "ended": Elements'
      # data/ended.geojson) to out/ended/, not published and not drawn, and keeps a daily copy beside the archive.
      - name: Snapshot of the program feeds
        run: python tools/snapshot.py --archive out/archive --dropped-out out/dropped.jsonl
      - name: Files for the MCP server (site/data/agent/; Verdict keeps its last copy if a fetch fails)
        run: python tools/agent_index.py
      - name: Share card (link-preview image; falls back to site/card-fallback.png, never fails the build)
        run: python tools/card.py --stamp-page
      - name: Keep today's snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="snapshots-$(date -u +%Y-%m)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "COP snapshots $(date -u +%Y-%m)" \
            --notes "One COP snapshot per UTC day (the last run of the day wins), kept for the 14-day timeline."
          gh release upload "$TAG" out/archive/*.geojson.gz $(ls out/archive/*-ended.json.gz 2>/dev/null) --clobber
      # Outage triage reads the snapshot just built and writes site/data/triage.json for the page and the MCP server.
      # Base rates come from the archived days: this month's and last month's release copies, downloaded to their own
      # folder (out/archive is what the step above uploads from), plus today's. A failure here never fails the build:
      # without base rates the readings say so, and without triage.json the page and the server say that.
      - name: Outage triage (base rates from the archive, then site/data/triage.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/rates-archive
          for TAG in "snapshots-$(date -u -d "$(date -u +%Y-%m-15) -1 month" +%Y-%m)" "snapshots-$(date -u +%Y-%m)"; do
            gh release download "$TAG" --dir out/rates-archive --pattern "*.geojson.gz" --pattern "*-ended.json.gz" \
              --clobber || echo "::warning::no archive copies from $TAG"
          done
          cp out/archive/*.geojson.gz out/rates-archive/
          cp out/archive/*-ended.json.gz out/rates-archive/ 2>/dev/null || true
          python tools/triage_rates.py --archive out/rates-archive || echo "::warning::base rates failed; triage runs without them"
          python tools/triage.py --snapshot site/data/today.geojson --ended out/ended/elements.geojson --publish site/data \
            || { rm -f site/data/triage.json; echo "::warning::outage triage failed; the page and the MCP server say it is unavailable"; }
      # The triage log (cop-purpose step 3, shape A): every reading triage has given, one item per outage and place with
      # its history of readings, kept after the outage ends (tools/triage_log.py, the kit's tic-history/1). Assets of
      # the release "triage-log", like the suite ledger, never in site/. The first build ever replays the archived
      # days downloaded above (one reading a day, marked backfill) before logging this build. A failure never fails the
      # build; that build is just not logged.
      - name: Triage log (kept as release assets, not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "::warning::triage log: $1; this build is not logged"; exit 0; }
          [ -f site/data/triage.json ] || skip "no triage.json"
          DAY=$(python tools/ledger.py --day site/data/today.geojson) || skip "the snapshot has no day"
          mkdir -p out/triage-log
          if gh release view triage-log >/dev/null 2>&1; then
            ASSETS=$(gh release view triage-log --json assets --jq '.assets[].name') || skip "the asset list could not be read"
            echo "$ASSETS" | grep -qx "state.json.gz" || skip "the release has no state.json.gz; rebuild it by hand with --replay"
            gh release download triage-log --dir out/triage-log --pattern state.json.gz --clobber || skip "the last state could not be downloaded"
            if echo "$ASSETS" | grep -qx "$DAY.jsonl.gz"; then
              gh release download triage-log --dir out/triage-log --pattern "$DAY.jsonl.gz" --clobber || skip "today's lines could not be downloaded"
            fi
            python tools/triage_log.py --triage site/data/triage.json --assets out/triage-log || skip "the tool failed"
          else
            # The archive copies include today's snapshot (out/archive), so the replay already holds this build's reading.
            python tools/triage_log.py --replay out/rates-archive --assets out/triage-log || skip "the replay failed"
            gh release create triage-log --title "COP triage log" \
              --notes "Every reading COP's outage triage has given: one item per outage and place, with what each layer showed and its history of readings (tic-history/1), one file per UTC day, and the readings open now (state.json.gz). Days before the first build are backfilled from the daily archive. Not a warning, not a forecast, not a finding of cause." \
              || skip "the release could not be created"
          fi
          gh release upload triage-log out/triage-log/*.gz --clobber \
            || echo "::warning::triage log: upload failed; the next build logs these readings again from the last state"
      # The three-signal join (published since Tom retired the mosaic gate, 15 Nov 2026): interference, a new notice
      # and a connectivity drop in the Strait of Hormuz and the Gulf, with Vis's weather beside them. It replays the
      # archive copies the step above downloaded for how often each signal fires anyway. A failure never fails the
      # build: without three-signal.json the page and the MCP server say the join is unavailable.
      - name: Three-signal join (site/data/three-signal.json)
        run: |
          python tools/three_signal.py --snapshot site/data/today.geojson --archive out/rates-archive --publish site/data \
            || { rm -f site/data/three-signal.json; echo "::warning::three-signal join failed; the page and the MCP server say it is unavailable"; }
      # The Red River Valley view: what this snapshot holds for North Dakota and Minnesota, by layer. It adds
      # no source. A failure never fails the build: without red-river.json the page says the view was not built.
      - name: Red River Valley view (site/data/red-river.json)
        run: |
          python tools/red_river.py --snapshot site/data/today.geojson --publish site/data             || { rm -f site/data/red-river.json; echo "::warning::Red River view failed; its page says it was not built"; }
      # COP's memory and the direction of concern (Tom, 21 Nov 2026): one record per subject, kept after it leaves the
      # picture (tools/memory.py, release "memory"), and each place's layers read against their own last two weeks
      # (tools/direction.py, site/data/direction.json). The first build rebuilds the memory from the archive copies
      # downloaded above. A memory that is listed but cannot be downloaded is never started over. A failure here never
      # fails the build: without direction.json the page leaves the section out.
      - name: Memory and direction of concern (site/data/direction.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { rm -f site/data/direction.json; rm -rf out/memory; echo "::warning::memory: $1; direction is not updated on this build"; exit 0; }
          mkdir -p out/memory
          ASSETS=""
          if gh release view memory >/dev/null 2>&1; then
            ASSETS=$(gh release view memory --json assets --jq '.assets[].name') || skip "the asset list could not be read"
          fi
          if echo "$ASSETS" | grep -qx "memory.json.gz"; then
            gh release download memory --dir out/memory --pattern memory.json.gz --clobber || skip "the memory could not be downloaded"
            python tools/memory.py --snapshot site/data/today.geojson --assets out/memory || skip "the memory tool failed"
          else
            python tools/memory.py --replay out/rates-archive --snapshot site/data/today.geojson --assets out/memory || skip "the first replay failed"
          fi
          python tools/direction.py --memory out/memory --archive out/rates-archive --snapshot site/data/today.geojson \
            --verdict site/data/agent/verdict.json --picks site/data/picks.json --publish site/data || skip "the direction join failed"
      # Lane records (tools/lane_log.py, ideas#330): every outage triage reads and every three-signal reading that
      # flags is logged once, before its outcome can be known, to lane-log.jsonl on the branch lane-log (append-only,
      # hash-chained, never forced, does not deploy), then site/data/lanes.json gives one record line per lane, counts
      # only, for the page and the MCP server. The direction log is read, never written, here. Verdict scores the
      # outcomes. A failure never fails the build: without lanes.json the page and the server leave the line out.
      - name: Lane records (branch lane-log, then site/data/lanes.json)
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          skip() { rm -f site/data/lanes.json; echo "::warning::lane records: $1; no lane line on this build"; exit 0; }
          LOG=out/lane-log.jsonl; DLOG=out/direction-log-read.jsonl; PARENT=""; rc=0
          git ls-remote --exit-code --heads origin lane-log >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --quiet origin +refs/heads/lane-log:refs/remotes/origin/lane-log || skip "the lane log could not be fetched"
            PARENT=$(git rev-parse refs/remotes/origin/lane-log)
            git show "$PARENT:lane-log.jsonl" > "$LOG" || skip "the lane log could not be read"
          elif [ "$rc" = 2 ]; then
            : > "$LOG"
          else
            skip "could not tell whether the lane log exists"
          fi
          : > "$DLOG"
          if git ls-remote --exit-code --heads origin direction-log >/dev/null; then
            git fetch --quiet origin +refs/heads/direction-log:refs/remotes/origin/direction-log \
              && git show refs/remotes/origin/direction-log:direction-log.jsonl > "$DLOG" \
              || { : > "$DLOG"; echo "::warning::lane records: the direction log could not be read"; }
          fi
          BEFORE=$(git hash-object "$LOG")
          python tools/lane_log.py --log "$LOG" --triage site/data/triage.json --three-signal site/data/three-signal.json \
            || skip "the tool failed"
          if [ "$(git hash-object "$LOG")" != "$BEFORE" ]; then
            BLOB=$(git hash-object -w "$LOG")
            TREE=$(printf '100644 blob %s\tlane-log.jsonl\n' "$BLOB" | git mktree)
            COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Lane log: build $GITHUB_SHA")
            # Published counts come only from lines that are locked: an unpushed line is not counted.
            git push origin "$COMMIT:refs/heads/lane-log" || {
              if [ -n "$PARENT" ]; then git show "$PARENT:lane-log.jsonl" > "$LOG"; else : > "$LOG"; fi
              echo "::warning::lane records: the push failed; this build's lines wait for the next build"; }
          fi
          python tools/lane_log.py --log "$LOG" --direction-log "$DLOG" --publish site/data --no-append \
            || skip "the record could not be written"
      # The Undertow sanctions join (join 0.1, published off until the owner turns it on): a Headwind list change naming an
      # organisation Undertow's publishers name, matched exactly against config/undertow-names.json. While off it
      # writes out/undertow-sanctions/ only. A failure never fails the build.
      - name: Undertow sanctions join (out/undertow-sanctions/)
        run: |
          python tools/undertow_sanctions.py --snapshot site/data/today.geojson \
            --list-changes https://headwind.theintelligence.company/data/list-changes.json \
            --out out/undertow-sanctions --publish site/data \
            || echo "::warning::Undertow sanctions join failed"
      # The Undertow election join (join 0.1, published off until the owner turns it on): an Undertow item whose activity or
      # disclosure period overlaps the 90 days before a national vote, on Verdict's calendar, in a country it states as
      # a target. While off it writes out/undertow-elections/ only. A failure never fails the build.
      - name: Undertow election join (out/undertow-elections/)
        run: |
          python tools/undertow_elections.py --snapshot site/data/today.geojson \
            --calendar https://metacog-osint.github.io/verdict/data/calendar.geojson \
            --out out/undertow-elections --publish site/data \
            || echo "::warning::Undertow election join failed"
      # The daily brief (tools/brief.py, site/brief/): five sentences on what changed, written once a UTC day at the
      # first build after 12:00 UTC and never replaced. Every brief is kept in the releases briefs-YYYY, one
      # <day>.json each; this step downloads them all, writes today's when it is due, and uploads it without
      # --clobber before the page is drawn, so the page only ever shows briefs that are kept. When the releases cannot
      # be read the page is drawn from the live briefs.json and nothing new is written; a failed upload drops the new
      # brief and the next build tries again. Never fails the build.
      - name: Daily brief (site/brief/; kept in the releases briefs-YYYY)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/briefs
          NEW=""
          fallback() {
            echo "::warning::daily brief: $1"
            [ -n "$NEW" ] && rm -f "$NEW"
            curl -sf -o out/briefs-live.json https://cop.theintelligence.company/brief/briefs.json || echo '{}' > out/briefs-live.json
            python tools/brief.py --store out/briefs --publish site/brief --render-only --seed out/briefs-live.json \
              || echo "::warning::daily brief: the page could not be drawn"
            exit 0
          }
          TAGS=$(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("briefs-"))') \
            || fallback "the release list could not be read"
          for TAG in $TAGS; do
            gh release download "$TAG" --dir out/briefs --pattern "*.json" --clobber || fallback "$TAG could not be downloaded"
          done
          python tools/brief.py --snapshot site/data/today.geojson --events site/data/agent/events.json \
            --verdict site/data/agent/verdict.json --store out/briefs --publish site/brief --new-out out/brief-new.txt \
            || fallback "the tool failed"
          NEW=$(cat out/brief-new.txt)
          if [ -n "$NEW" ]; then
            YEAR=$(basename "$NEW" | cut -c1-4)
            TAG="briefs-$YEAR"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "COP daily briefs $YEAR" \
              --notes "COP's daily brief, one <day>.json per UTC day (cop-brief/1), written once and never replaced. Published at https://cop.theintelligence.company/brief/. Measurements and scheduled events, never warnings." \
              || fallback "the release $TAG could not be created; today's brief waits for the next build"
            gh release upload "$TAG" "$NEW" || fallback "the upload failed; today's brief waits for the next build"
            echo "daily brief: kept $(basename "$NEW") in $TAG"
          fi
      # History across programs (tools/history.py): what every layer showed per day, country, area and subject, as a
      # Parquet set plus small per-place files for the MCP server's history tool and the place pages. Rebuilt once a
      # UTC day, by the first build after midnight, from closed days only: COP's daily snapshots, its ledger and the
      # programs' own logs (history/log in each repository named in config/history.json, read with a sparse clone).
      # The set is derived and is kept in the release history as one history.tar.gz, replaced at each rebuild; every
      # other build serves that copy. Never fails the build: without it the page and the tool say it is absent.
      - name: History across programs (site/data/history; rebuilt once a UTC day, kept in the release history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning::history: $1"; }
          TODAY=$(date -u +%F)
          mkdir -p out/history-prev site/data/history
          BUILT=""
          if gh release view history >/dev/null 2>&1 \
             && gh release download history --dir out/history-prev --pattern history.tar.gz --clobber; then
            tar -xzf out/history-prev/history.tar.gz -C site/data/history \
              && BUILT=$(python -c "import json; print(json.load(open('site/data/history/manifest.json'))['built_at'][:10])") \
              || warn "the kept copy could not be unpacked"
          fi
          if [ "$BUILT" = "$TODAY" ]; then echo "history: built $BUILT, serving the kept copy"; exit 0; fi
          T0=$(date +%s)
          pip install --quiet --disable-pip-version-check pyarrow==26.0.1 || { warn "pyarrow could not be installed; serving the copy built $BUILT"; exit 0; }
          IN=out/history-in
          mkdir -p "$IN/snapshots" "$IN/ledger" "$IN/logs"
          for TAG in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("snapshots-"))'); do
            gh release download "$TAG" --dir "$IN/snapshots" --pattern "????-??-??.geojson.gz" --clobber \
              || { warn "$TAG could not be downloaded; serving the copy built $BUILT"; exit 0; }
          done
          for TAG in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(test("^ledger(-[0-9]{4})?$"))'); do
            gh release download "$TAG" --dir "$IN/ledger" --pattern "????-??-??.jsonl.gz" --clobber \
              || { warn "$TAG could not be downloaded; serving the copy built $BUILT"; exit 0; }
          done
          for P in $(python -c "import json; print(' '.join(json.load(open('config/history.json'))['program_logs']))"); do
            REPO=$(python -c "import json,sys; print(json.load(open('config/history.json'))['program_logs'][sys.argv[1]])" "$P")
            git clone -q --depth 1 --filter=blob:none --sparse "https://github.com/$REPO.git" "$IN/repo-$P" \
              && git -C "$IN/repo-$P" sparse-checkout set --no-cone history/log \
              && [ -d "$IN/repo-$P/history/log" ] && mkdir -p "$IN/logs/$P" && mv "$IN/repo-$P/history/log" "$IN/logs/$P/log" \
              || warn "$P's own log could not be read; its events come from COP's ledger only"
          done
          python tools/history.py --archive "$IN/snapshots" --ledger "$IN/ledger" --logs "$IN/logs" \
            --publish out/history-new --before "$TODAY" || { warn "the tool failed; serving the copy built $BUILT"; exit 0; }
          tar -czf out/history.tar.gz -C out/history-new .
          echo "history: rebuilt in $(( $(date +%s) - T0 )) s, $(du -sh out/history-new | cut -f1) on disk, archive $(du -h out/history.tar.gz | cut -f1)"
          rm -rf site/data/history && cp -r out/history-new site/data/history
          gh release view history >/dev/null 2>&1 || gh release create history --title "COP history across programs" \
            --notes "What every layer of COP showed per day, country, area and subject (tools/history.py, cop-history/1): a Parquet set and the per-place files the site serves at /data/history/. Derived from COP's daily snapshots, its ledger and the programs' own logs, and rebuilt from them once a UTC day; history.tar.gz is replaced at each rebuild." \
            || { warn "the release could not be created; the new set is served but not kept"; exit 0; }
          gh release upload history out/history.tar.gz --clobber || warn "the new set is served but was not kept; the next build rebuilds it"
      - name: Join check (stops the deploy if a refused or unpublished join sits in site/, functions/ or mcp/)
        run: python tools/gate.py --check
      - name: Deploy site/ and functions/ (the MCP server at /mcp) to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          npx --yes wrangler@4.151.3 pages deploy site --project-name cop --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "build $GITHUB_SHA" --commit-dirty=true
      # Archives kept after the deploy (retention, 18 Nov 2026). They run after the site is out so that a failure here
      # never holds the live view back, and each one FAILS THE STEP (red run, GitHub's mail) instead of logging a
      # warning: a ledger or archive upload that did not happen is data not kept. Each runs even when another of them
      # failed (the `if:`), but only after the deploy step itself succeeded.
      #
      # One snapshot per 6-hour slot of the UTC day (00, 06, 12, 18), besides the daily copy above: the first build in
      # each slot, named <day>T<HH>Z.snap.json.gz in the month's snapshots release. A slot's file is never replaced:
      # it is uploaded only when the release does not hold it yet (no --clobber), so the first build of the slot wins.
      - name: Keep the 6-hourly snapshots (first build of each slot)
        id: slots
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="snapshots-$(date -u +%Y-%m)"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in out/archive/*.snap.json.gz; do
            [ -e "$f" ] || { echo "::error::no 6-hourly snapshot file was written"; exit 1; }
            name=$(basename "$f")
            if echo "$ASSETS" | grep -qx "$name"; then
              echo "$name is already kept"
              continue
            fi
            ok=""
            for i in 1 2 3; do
              if gh release upload "$TAG" "$f"; then ok=1; break; fi
              sleep $((i * 10))
            done
            [ -n "$ok" ] || { echo "::error::6-hourly snapshot $name could not be uploaded to $TAG"; exit 1; }
          done
      # The suite ledger (tools/ledger.py, the kit's tic-history/1): what is new, changed or ended since the last
      # build, with each full item. The open state (state.json.gz, and state-before-subject-id.json.gz) stays in the
      # release "ledger" for good. The day files (YYYY-MM-DD.jsonl.gz) stay in "ledger" through 2026 and, from 2027, go
      # to one release per year, "ledger-YYYY" (the 1,000-asset limit: about 2.7 years of one file a day), created
      # when missing; the readers of the existing release lose nothing. Never in site/. The step reads the release's
      # asset list first: an asset that is listed but cannot be downloaded stops the step, so a failed download never
      # starts the ledger over or overwrites a day's earlier lines. A failed UPLOAD fails the step (three tries, the day
      # file first, then the state), since a build that is not logged and not retried is a gap.
      - name: Suite ledger (kept as release assets, not published)
        id: ledger
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "::warning::suite ledger: $1; this build is not logged"; exit 0; }
          fail() { echo "::error::suite ledger: $1"; exit 1; }
          up() { for i in 1 2 3; do gh release upload "$@" && return 0; sleep $((i * 10)); done; return 1; }
          DAY=$(python tools/ledger.py --day site/data/today.geojson) || skip "the snapshot has no day"
          if [ "${DAY%%-*}" -le 2026 ]; then DAYTAG=ledger; else DAYTAG="ledger-${DAY%%-*}"; fi
          mkdir -p out/ledger
          FIRST=""
          if gh release view ledger >/dev/null 2>&1; then
            ASSETS=$(gh release view ledger --json assets --jq '.assets[].name') || skip "the asset list could not be read"
            if echo "$ASSETS" | grep -qx "state.json.gz"; then
              gh release download ledger --dir out/ledger --pattern state.json.gz --clobber || skip "the last state could not be downloaded"
            else
              FIRST="--first"
            fi
          else
            gh release create ledger --title "COP suite ledger" \
              --notes "Every item COP's picture has carried: one line per item that is new, changed or ended at each build (tic-history/1), one file per UTC day, and the items open now (state.json.gz). Day files for 2027 on are in the releases ledger-YYYY; the state stays here. Not published." \
              || skip "the release could not be created"
            ASSETS=""
            FIRST="--first"
          fi
          if [ "$DAYTAG" != ledger ]; then
            gh release view "$DAYTAG" >/dev/null 2>&1 || gh release create "$DAYTAG" --title "COP suite ledger $DAY" \
              --notes "COP suite ledger day files for ${DAY%%-*}: one YYYY-MM-DD.jsonl.gz per UTC day (tic-history/1). The open state, state.json.gz, is in the release ledger. Not published." \
              || skip "the release $DAYTAG could not be created"
            ASSETS_DAY=$(gh release view "$DAYTAG" --json assets --jq '.assets[].name') || skip "the asset list of $DAYTAG could not be read"
          else
            ASSETS_DAY="$ASSETS"
          fi
          if echo "$ASSETS_DAY" | grep -qx "$DAY.jsonl.gz"; then
            gh release download "$DAYTAG" --dir out/ledger --pattern "$DAY.jsonl.gz" --clobber || skip "today's lines could not be downloaded"
          fi
          python tools/ledger.py --snapshot site/data/today.geojson --assets out/ledger $FIRST || skip "the tool failed"
          # The state as it was before the ledger was keyed on subject_id (kit 0.6.0): kept once, never replaced, and
          # uploaded before the new state so the old one cannot be lost.
          if [ -f out/ledger/state-before-subject-id.json.gz ] && ! echo "$ASSETS" | grep -qx "state-before-subject-id.json.gz"; then
            up ledger out/ledger/state-before-subject-id.json.gz || fail "the state before re-keying could not be kept"
          fi
          # The day's lines first (a superset of the file already there, so --clobber loses nothing), then the state.
          if [ -f "out/ledger/$DAY.jsonl.gz" ]; then
            up "$DAYTAG" "out/ledger/$DAY.jsonl.gz" --clobber || fail "the lines for $DAY could not be uploaded to $DAYTAG; this build is not logged and the changes will be logged again from the last state"
          fi
          up ledger out/ledger/state.json.gz --clobber || fail "the new state could not be uploaded; the next build logs these changes again from the last state (the day file already holds them once)"
      # COP's memory: the current file, plus one copy per month that is never replaced. A failed upload fails the step,
      # as for the ledger: the next build folds this one in again from the last copy kept.
      - name: Keep COP's memory (release memory, not published)
        id: memory
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/memory/memory.json.gz ] || { echo "no memory from this build"; exit 0; }
          up() { for i in 1 2 3; do gh release upload "$@" && return 0; sleep $((i * 10)); done; return 1; }
          gh release view memory >/dev/null 2>&1 || gh release create memory --title "COP memory" \
            --notes "One record per subject COP's picture has carried, kept after it leaves, and each place's daily direction word (tools/memory.py, tools/direction.py). Not published on the site."
          MONTH="memory-$(date -u +%Y-%m).json.gz"
          if ! gh release view memory --json assets --jq '.assets[].name' | grep -qx "$MONTH"; then
            cp out/memory/memory.json.gz "out/memory/$MONTH"
            up memory "out/memory/$MONTH" || { echo "::error::the month's copy of the memory could not be kept"; exit 1; }
          fi
          up memory out/memory/memory.json.gz --clobber || { echo "::error::the memory could not be uploaded"; exit 1; }
      # The direction log (tools/direction_log.py, ideas#126): each Monday's word per place and, ten days later, the
      # numbers for the week that followed, appended to direction-log.jsonl on the branch direction-log. Each line
      # carries the hash of the one before and the push is never forced, so a word cannot be changed once its week has
      # begun. The branch does not deploy. Verdict reads it and does the scoring. A failure here is red and holds nothing.
      - name: Lock the direction words (branch direction-log)
        id: direction_log
        if: ${{ !cancelled() }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -eu
          if [ ! -f site/data/direction.json ] || [ ! -f out/memory/memory.json.gz ]; then
            echo "no direction reading from this build"; exit 0
          fi
          LOG=out/direction-log.jsonl; PARENT=""; rc=0
          git ls-remote --exit-code --heads origin direction-log >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --quiet origin +refs/heads/direction-log:refs/remotes/origin/direction-log
            PARENT=$(git rev-parse refs/remotes/origin/direction-log)
            git show "$PARENT:direction-log.jsonl" > "$LOG"
          elif [ "$rc" = 2 ]; then
            : > "$LOG"
          else
            echo "::error::could not tell whether the direction log exists"; exit 1
          fi
          BEFORE=$(git hash-object "$LOG")
          python tools/direction_log.py --log "$LOG" --direction site/data/direction.json --memory out/memory
          if [ "$(git hash-object "$LOG")" = "$BEFORE" ]; then echo "nothing new to lock"; exit 0; fi
          BLOB=$(git hash-object -w "$LOG")
          TREE=$(printf '100644 blob %s\tdirection-log.jsonl\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Direction log: build $GITHUB_SHA")
          git push origin "$COMMIT:refs/heads/direction-log"
      # The dropped-items log (tools/dropped.py, retention audit C2): the features snapshot.py's sift() left out as
      # malformed, each with its reason and the item as published, in <day>.dropped.jsonl.gz beside the ledger's day file
      # (same release rule as above). A feed keeps a bad item for days, so a row is written once a day. Not published.
      - name: Dropped items (kept beside the ledger, not published)
        id: dropped
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/dropped.jsonl ] || { echo "nothing was left out as malformed this build"; exit 0; }
          up() { for i in 1 2 3; do gh release upload "$@" && return 0; sleep $((i * 10)); done; return 1; }
          DAY=$(python tools/ledger.py --day site/data/today.geojson)
          if [ "${DAY%%-*}" -le 2026 ]; then DAYTAG=ledger; else DAYTAG="ledger-${DAY%%-*}"; fi
          mkdir -p out/ledger-dropped
          if gh release view "$DAYTAG" >/dev/null 2>&1; then
            ASSETS=$(gh release view "$DAYTAG" --json assets --jq '.assets[].name')
          else
            gh release create "$DAYTAG" --title "COP suite ledger ${DAY%%-*}" \
              --notes "COP suite ledger day files (tic-history/1) and the dropped-items logs for ${DAY%%-*}. Not published."
            ASSETS=""
          fi
          if echo "$ASSETS" | grep -qx "$DAY.dropped.jsonl.gz"; then
            gh release download "$DAYTAG" --dir out/ledger-dropped --pattern "$DAY.dropped.jsonl.gz" --clobber
          fi
          python tools/dropped.py --rows out/dropped.jsonl --assets out/ledger-dropped --day "$DAY"
          [ -f "out/ledger-dropped/$DAY.dropped.jsonl.gz" ] || exit 0
          up "$DAYTAG" "out/ledger-dropped/$DAY.dropped.jsonl.gz" --clobber \
            || { echo "::error::the dropped-items log for $DAY could not be uploaded to $DAYTAG"; exit 1; }
